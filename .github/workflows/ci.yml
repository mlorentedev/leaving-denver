# CI scaffolded by `dotf init`. The Spec-Driven Development convention is
# documented in AGENTS.md; wire an enforced spec-gate when your project wants one.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Deploys are manual until the catalog is ready to list. Any branch other
  # than main is a preview (<branch>.leaving-denver.pages.dev); main is live.
  workflow_dispatch:
    inputs:
      branch:
        description: "Pages branch: 'main' publishes the live site, anything else a preview"
        required: true
        default: preview

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder so the public build can run; the real number is only used by
      # the deploy job. The sops file is not decryptable here, so tests that need
      # the reserve floors skip.
      SELLER_PHONE: "+15555550100"
    steps:
      - uses: actions/checkout@v7

      # LFS objects are cached so each run does not re-download every photo.
      - name: Hash LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1 > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: make install
      - run: make check

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    # One deploy per Pages branch at a time; a second dispatch waits.
    concurrency:
      group: pages-${{ inputs.branch }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.branch == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      SELLER_PHONE: ${{ secrets.SELLER_PHONE }}
    steps:
      # The input reaches wrangler's command line, so only a plain branch name
      # gets through. Production only ever gets a build of main.
      - name: Validate branch input
        env:
          BRANCH: ${{ inputs.branch }}
          REF: ${{ github.ref }}
        run: |
          [[ "$BRANCH" =~ ^[a-z0-9][a-z0-9-]{0,27}$ ]] || { echo "invalid branch: $BRANCH"; exit 1; }
          [[ "$BRANCH" != main || "$REF" == refs/heads/main ]] || { echo "branch=main must be dispatched from main, not $REF"; exit 1; }

      - uses: actions/checkout@v7

      - name: Hash LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1 > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: make install
      # Same gate as the test job, now against the build with the real number.
      - run: make check

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret; same value as CF_ACCOUNT_ID in the Makefile.
          accountId: "76967f5ede1ce50efce34d90b7e94958"
          wranglerVersion: "4.141.0"
          command: pages deploy --project-name=leaving-denver --branch=${{ inputs.branch }}

      - name: Smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: scripts/smoke.sh "$DEPLOYMENT_URL"
