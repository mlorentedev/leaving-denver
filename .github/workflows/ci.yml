# CI scaffolded by `dotf init`. The Spec-Driven Development convention is
# documented in AGENTS.md; wire an enforced spec-gate when your project wants one.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Pushes to main publish production after tests. Manual dispatch remains
  # available for previews and explicit production redeploys.
  workflow_dispatch:
    inputs:
      branch:
        description: "Pages branch: 'main' publishes the live site, anything else a preview"
        required: true
        default: preview

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder so the public build can run; the real number is only used by
      # the deploy job. The sops file is not decryptable here, so tests that need
      # the reserve floors skip.
      SELLER_PHONE: "+15555550100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # LFS objects are cached so each run does not re-download every photo.
      - name: Hash LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1 > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: make install
      - run: make check

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    # One deploy per Pages branch at a time; later runs wait.
    concurrency:
      group: pages-${{ github.event_name == 'push' && 'main' || inputs.branch }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'push' && 'production' || inputs.branch == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      SELLER_PHONE: ${{ secrets.SELLER_PHONE }}
      # A production deploy smokes a candidate first; a dispatched preview deploys once.
      PRODUCTION: ${{ github.event_name == 'push' || inputs.branch == 'main' }}
    steps:
      # The input reaches wrangler's command line, so only a plain branch name
      # gets through. Production only ever gets a build of main.
      - name: Validate branch input
        env:
          BRANCH: ${{ github.event_name == 'push' && 'main' || inputs.branch }}
          REF: ${{ github.ref }}
        run: |
          [[ "$BRANCH" =~ ^[a-z0-9][a-z0-9-]{0,27}$ ]] || { echo "invalid branch: $BRANCH"; exit 1; }
          [[ "$BRANCH" != main || "$REF" == refs/heads/main ]] || { echo "branch=main must be dispatched from main, not $REF"; exit 1; }

      # The test job's placeholder must never reach a deployed page.
      - name: Require production contact
        run: |
          # Digits only, so a reformatted placeholder ("(555) 555-0100") is refused too.
          digits="${SELLER_PHONE//[^0-9]/}"
          if [ -z "$digits" ] || [ "${digits#1}" = "5555550100" ]; then
            echo "::error::SELLER_PHONE secret is required for deployment"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hash LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1 > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: make install
      # Same gate as the test job, now against the build with the real number.
      - run: make check

      # The build goes to the Pages branch `candidate` and is smoked there first, so a
      # broken build stops here and production keeps serving the previous deployment.
      - id: candidate
        if: env.PRODUCTION == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "76967f5ede1ce50efce34d90b7e94958"
          wranglerVersion: "4.141.0"
          command: pages deploy --project-name=leaving-denver --branch=candidate

      - name: Smoke the candidate
        if: env.PRODUCTION == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.deployment-url }}
        run: scripts/smoke.sh "$DEPLOYMENT_URL"

      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret; same value as CF_ACCOUNT_ID in the Makefile.
          accountId: "76967f5ede1ce50efce34d90b7e94958"
          wranglerVersion: "4.141.0"
          command: pages deploy --project-name=leaving-denver --branch=${{ github.event_name == 'push' && 'main' || inputs.branch }}

      # Production is checked where buyers reach it; a preview at its own deployment.
      - name: Smoke test
        env:
          DEPLOYMENT_URL: ${{ env.PRODUCTION == 'true' && 'https://leaving-denver.pages.dev' || steps.deploy.outputs.deployment-url }}
        run: scripts/smoke.sh "$DEPLOYMENT_URL"
