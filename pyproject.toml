[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leaving-denver"
version = "0.1.0"
description = "Privacy-focused moving sale platform and inventory liquidation pipeline for Denver Tech Center"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
leaving-denver = "leaving_denver.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leaving_denver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line length; long strings and URLs are left alone.
ignore = ["E501"]
