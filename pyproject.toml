[project]
name = "leaving-denver"
version = "0.1.0"
description = "Privacy-focused moving sale platform and inventory liquidation pipeline for Denver Tech Center"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line length; long strings and URLs are left alone.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# manage.py puts the repo root on sys.path before importing src.
"manage.py" = ["E402"]
