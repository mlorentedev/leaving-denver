{# Open Graph and card tags (FEAT-002). Every URL is absolute: previews are fetched from elsewhere. #}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ t.site_name }}">
  <meta property="og:title" content="{{ og.title }}">
  <meta property="og:description" content="{{ og.description }}">
  <meta property="og:url" content="{{ og.url }}">
  <meta property="og:locale" content="{{ og.locale }}">
  <meta property="og:locale:alternate" content="{{ og.locale_alternate }}">
{% if og.image %}
  <meta property="og:image" content="{{ og.image }}">
  <meta property="og:image:width" content="{{ og.image_width }}">
  <meta property="og:image:height" content="{{ og.image_height }}">
  <meta property="og:image:alt" content="{{ og.image_alt }}">
  <meta name="twitter:card" content="summary_large_image">
{% else %}
  <meta name="twitter:card" content="summary">
{% endif %}
