<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>{{ og.title }} · {{ t.site_name }}</title>
{% include "_og.html" %}
  <link rel="icon" type="image/svg+xml" href="{{ asset_prefix }}favicon.svg">
  <link rel="alternate" hreflang="en" href="{{ language_links.en }}">
  <link rel="alternate" hreflang="es" href="{{ language_links.es }}">
  <link rel="preload" href="{{ asset_prefix }}fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset_prefix }}styles.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-[#fbfbfb] text-[#1c1c1c] antialiased min-h-screen flex flex-col">
  <header class="w-full border-b border-neutral-200/80 bg-white">
    <div class="max-w-5xl w-full mx-auto px-4 sm:px-6 h-16 flex items-center">
      <span class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-lg bg-neutral-900 text-white font-bold text-xs flex items-center justify-center">DTC</span>
        <span class="font-bold tracking-tight text-neutral-900 text-sm sm:text-base">{{ t.site_name }}</span>
      </span>
      <nav class="ml-auto flex items-center gap-2 text-xs font-bold">
        <a href="{{ language_links.en }}" hreflang="en" lang="en" class="min-w-10 min-h-10 flex items-center justify-center {{ 'text-neutral-900' if locale == 'en' else 'text-neutral-500' }}">EN</a>
        <span class="text-neutral-300" aria-hidden="true">/</span>
        <a href="{{ language_links.es }}" hreflang="es" lang="es" class="min-w-10 min-h-10 flex items-center justify-center {{ 'text-neutral-900' if locale == 'es' else 'text-neutral-500' }}">ES</a>
      </nav>
    </div>
  </header>
  <main data-role="sale-over" class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-24 text-center">
    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-neutral-900">{{ t.sale_over_heading }}</h1>
    <p class="mt-4 text-lg text-neutral-600">{{ t.sale_over_thanks }}</p>
  </main>
</body>
</html>
