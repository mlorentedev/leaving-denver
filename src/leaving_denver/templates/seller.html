<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Seller listing copy · DTC Moving Sale</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body class="bg-neutral-50 text-neutral-900 min-h-screen p-4 sm:p-8">
  <main class="mx-auto max-w-xl space-y-5">
    <nav><a class="underline text-sm" href="../">Back to catalog</a></nav>
    <header>
      <h1 class="text-2xl font-bold">Seller listing copy</h1>
      <p class="text-sm text-neutral-600">Mobile copy from published items and asking prices only. Private reserve prices stay on your computer.</p>
    </header>
    <label class="block font-semibold" for="item">Item
      <select id="item" class="block w-full p-3 mt-1 bg-white border border-neutral-300 rounded-lg"></select>
    </label>
    <label class="block font-semibold" for="platform">Platform
      <select id="platform" class="block w-full p-3 mt-1 bg-white border border-neutral-300 rounded-lg">
        <option value="fb">Facebook Marketplace</option>
        <option value="cl">Craigslist</option>
        <option value="offerup">OfferUp</option>
        <option value="nextdoor">Nextdoor</option>
      </select>
    </label>
    <img id="photo" class="max-h-64 w-full object-contain bg-white rounded-lg" alt="" hidden>
    <div>
      <label class="block font-semibold" for="title">Title</label>
      <input id="title" class="w-full p-3 mt-1 bg-white border border-neutral-300 rounded-lg" type="text">
      <button type="button" data-copy="title" class="mt-2 px-4 py-3 bg-neutral-900 text-white rounded-lg">Copy title</button>
    </div>
    <div>
      <label class="block font-semibold" for="description">Description</label>
      <textarea id="description" rows="13" class="w-full p-3 mt-1 bg-white border border-neutral-300 rounded-lg"></textarea>
      <button type="button" data-copy="description" class="mt-2 px-4 py-3 bg-neutral-900 text-white rounded-lg">Copy description</button>
    </div>
    <div>
      <label class="block font-semibold" for="link">Item link with platform attribution</label>
      <input id="link" class="w-full p-3 mt-1 bg-white border border-neutral-300 rounded-lg" type="url" readonly>
      <button type="button" data-copy="link" class="mt-2 px-4 py-3 bg-neutral-900 text-white rounded-lg">Copy link</button>
    </div>
    <p id="status" role="status" aria-live="polite" class="text-sm"></p>
  </main>
  <script>const ITEMS = {{ items_json | safe }}; window.posterItems = ITEMS;</script>
  <script type="module" src="seller.mjs"></script>
</body>
</html>
