# PR-Agent (The-PR-Agent/pr-agent, MIT) on NaN cluster inference.
#
# Why this repo needs a second reviewer: measured 2026-09-26 over every PR (#1, #11,
# #36, #40, #42), CodeRabbit posted a real review on 2, `Review limit reached` on 2 more
# (#36, #40) and nothing on #1. Its quota is shared account-wide.
#
# Ported from mlorentedev/yt-metrics-cli; the reviewer instructions and the ignore list
# are rewritten for this repo.

[config]
# The model, its fallback and the token budgets are set by the shared workflow
# (mlorentedev/ci-workflows pr-agent.yml) through environment variables, which sit
# above this file, so they are not repeated here.

response_language = "en-US"

# `AGENTS.md` is the agent SSOT here (architecture map, invariants, technical
# standards, commands, key paths, review-gate notes) and is the only context file
# worth the reviewer's tokens. Until 2026-09-22 no root `AGENTS.md` existed, so this
# named `.claude/CLAUDE.md`; that file is now a thin pointer to `AGENTS.md`, and
# naming it would hand the reviewer the pointer instead of the content.
repo_context_files = ["AGENTS.md"]

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
persistent_comment = true
final_update_message = false

# No "compliance sweep" preamble: asked for on every review and delivered once in
# sixteen at dotfiles (#1072, recommendation was deletion). An instruction ignored 94 %
# of the time is a comment, not a control.
extra_instructions = """
Classify each finding as REAL, THEORETICAL or SPECULATIVE. State the class as
the first line of its issue_content, alone on that line and spelled exactly
"Class: REAL", "Class: THEORETICAL" or "Class: SPECULATIVE". The triage reads
only that line; a finding without it goes to a human unclassified.

CI runs `make check`: ruff lint and format, a full build, and pytest against that
build. Do not restate what those report.

This is a static catalog for a moving sale in a PUBLIC repository. What static
analysis cannot see, and what matters here:

- private data reaching build/public/: reserve floors, the phone outside its
  fragmented `_C` form, or anything from data/private.sops.yaml. The public build is
  deployed to Cloudflare Pages. The one private thing in it is the sealed envelope in
  seller/index.html (ciphertext, ADR-007); plaintext of it anywhere is a leak.
- a secret on argv, stdout or in a log line: the deploy token and the phone move from
  sops into `gh secret set` or wrangler's environment, never through echo or argv.
- listing copy (templates, data/inventory.yaml) that claims something the data does
  not back, or manufactures urgency: invented scarcity, fake deadlines, "prices will
  rise". docs/lessons/lesson-008 is the rule.
- a workflow change that could publish to production from a ref other than main, or
  widen the GITHUB_TOKEN permissions.
- the inventory-template contract: a field renamed in data/inventory.yaml or the
  builder but not in the templates renders empty or broken on the page.
- a test that passes vacuously, or a guard that cannot fail the way its comment says.

A REAL finding needs a
concrete trace: file and line, failing input, or a command and its output. Do not flag
an import or dependency as missing when CI installs and tests pass; trust
pyproject.toml and uv.lock. Write in English. Conventional Commits and no AI
attribution are enforced here, so do not propose commit messages that carry either.
"""

[pr_code_suggestions]
# Present on purpose. Omitting this block is how upstream shipped the tool with its
# stated function disabled: the default `dual_publishing_score_threshold` is -1, which
# never publishes inline (dotfiles measured 2 bot comments and 0 inline across three
# PRs before noticing). 7 is upstream's own medium boundary.
dual_publishing_score_threshold = 7
suggestions_score_threshold = 5
publish_output_no_suggestions = false

[ignore]
# Applied BEFORE the model call:
#   - uv.lock is resolved metadata reviewed where it was bumped;
#   - data/private.sops.yaml is ciphertext, so the model can only guess about it, and
#     guesses about secrets are the noise this file exists to avoid;
#   - content/ holds photos (Git LFS pointers in the diff).
glob = [
  "uv.lock",
  "data/private.sops.yaml",
  "content/**",
  "**/*.log",
]
